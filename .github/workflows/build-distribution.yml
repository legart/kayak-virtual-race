name: Build Compose Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            gradlew: ./gradlew
            artifact_name: kayak-virtual-race-linux-deb
            artifact_path: build/compose/binaries/main/deb/*.deb
          - name: Windows
            os: windows-latest
            gradlew: .\gradlew.bat
            artifact_name: kayak-virtual-race-windows-msi
            artifact_path: build/compose/binaries/main/msi/*.msi
          - name: macOS
            os: macos-latest
            gradlew: ./gradlew
            artifact_name: kayak-virtual-race-macos-dmg
            artifact_path: build/compose/binaries/main/dmg/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Run tests and build Compose distribution
        run: ${{ matrix.gradlew }} test packageDistributionForCurrentOS --no-daemon

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
